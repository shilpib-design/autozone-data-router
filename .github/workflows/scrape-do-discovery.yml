name: Scrape.do AutoZone Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Scrape.do discovery
        env:
          SCRAPE_DO_API_KEY: ${{ secrets.SCRAPE_DO_API_KEY }}
        run: |
          test -n "$SCRAPE_DO_API_KEY" || (echo "SCRAPE_DO_API_KEY GitHub Actions secret is missing" && exit 1)
          mkdir -p results
          python - <<'PY'
          import json
          from pathlib import Path
          from providers.scrape_do import run_discovery

          test_case = json.loads(Path("config/test_case.json").read_text())
          result = run_discovery(test_case)

          output = {
              "provider": result.provider,
              "request_success": result.request_success,
              "latency_ms": result.latency_ms,
              "provider_cost": result.provider_cost,
              "error": result.error,
              "raw_response": result.raw_response,
          }
          Path("results/scrape_do_discovery.json").write_text(
              json.dumps(output, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )

          print(json.dumps({
              "provider": result.provider,
              "request_success": result.request_success,
              "latency_ms": result.latency_ms,
              "provider_cost": result.provider_cost,
              "error": result.error,
          }, indent=2))
          PY

      - name: Upload discovery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-do-autozone-discovery
          path: results/scrape_do_discovery.json
          if-no-files-found: warn
          retention-days: 7
