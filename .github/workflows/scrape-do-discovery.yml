name: Scrape.do AutoZone Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "providers/**"
      - "config/**"
      - "runner/**"
      - "requirements.txt"
      - ".github/workflows/scrape-do-discovery.yml"

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show commit being tested
        run: git log -1 --format="%H %s"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run controlled Scrape.do diagnostics
        env:
          SCRAPE_DO_API_KEY: ${{ secrets.SCRAPE_DO_API_KEY }}
        run: |
          test -n "$SCRAPE_DO_API_KEY" || (echo "SCRAPE_DO_API_KEY GitHub Actions secret is missing" && exit 1)
          mkdir -p results
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from providers.scrape_do import ScrapeDoProvider

          test_case = json.loads(Path("config/test_case.json").read_text())
          provider = ScrapeDoProvider()
          results = provider.controlled_diagnose(test_case)

          def body_text(raw):
              body = (raw or {}).get("body", "")
              if isinstance(body, dict):
                  return json.dumps(body, ensure_ascii=False)
              return str(body)

          def clean(text):
              text = re.sub(r"<script[\s\S]*?</script>", " ", text, flags=re.I)
              text = re.sub(r"<style[\s\S]*?</style>", " ", text, flags=re.I)
              text = re.sub(r"<[^>]+>", " ", text)
              text = re.sub(r"\\s+", " ", text)
              return text.strip()

          def first(pattern, text, flags=re.I):
              m = re.search(pattern, text, flags)
              return m.group(1).strip() if m else None

          for result in results:
              raw = result.raw_response or {}
              text = body_text(raw)
              plain = clean(text)
              label = raw.get("label", result.provider)
              print("\n========== AUTOZONE RESULT ==========")
              print(f"Test: {label}")
              print(f"HTTP: {raw.get('status_code')}")
              print(f"Success: {result.request_success}")
              print(f"Latency: {result.latency_ms} ms")
              print(f"Scrape.do Cost: {result.provider_cost}")
              print(f"Initial Status: {(raw.get('headers') or {}).get('Scrape.do-Initial-Status-Code')}")
              print(f"Resolved URL: {(raw.get('headers') or {}).get('Scrape.do-Resolved-Url')}")
              print(f"Response Size: {len(text)} characters")

              print("\nPRODUCT")
              print("Name candidate:", first(r"(?:productName|product_name|name)[\\\"']*\\s*[:=]\\s*[\\\"']([^\\\"']+)", text) or "NOT FOUND")
              print("Part Number candidate:", first(r"(?:partNumber|part_number|partNo|part)[\\\"']*\\s*[:=]\\s*[\\\"']([^\\\"']+)", text) or "NOT FOUND")
              print("SKU candidate:", first(r"(?:sku|productId|product_id)[\\\"']*\\s*[:=]\\s*[\\\"']?([^,\\\"' }]+)", text) or "NOT FOUND")
              print("Price candidate:", first(r"(?:price|salePrice|sale_price)[\\\"']*\\s*[:=]\\s*[\\\"']?([$]?[0-9]+(?:\\.[0-9]{2})?)", text) or "NOT FOUND")

              print("\nAVAILABILITY / LOCATION SIGNALS")
              for term in ["90001", "5425", "1457 E Florence", "pickup", "shipping", "availability", "stock", "delivery"]:
                  pos = plain.lower().find(term.lower())
                  if pos >= 0:
                      print(f"{term}: FOUND -> ...{plain[max(0,pos-180):pos+300]}...")
                  else:
                      print(f"{term}: NOT FOUND")

              print("\nVALIDATION SIGNALS")
              for field, patterns in {
                  "product_name": ["duralast", "brake"],
                  "part_number": ["mkd619"],
                  "price": ["52.99"],
                  "availability": ["availability", "pickup", "shipping", "stock"]
              }.items():
                  found = any(p.lower() in plain.lower() for p in patterns)
                  print(f"{field}: {'PASS-SIGNAL' if found else 'NO-SIGNAL'}")

              print("\nRESPONSE TEXT PREVIEW")
              print(plain[:5000])
              print("====================================\n")

          Path("results/scrape_do_diagnostics.json").write_text(
              json.dumps([
                  {
                      "provider": r.provider,
                      "request_success": r.request_success,
                      "latency_ms": r.latency_ms,
                      "provider_cost": r.provider_cost,
                      "error": r.error,
                      "raw_response": r.raw_response,
                  }
                  for r in results
              ], indent=2, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-do-autozone-diagnostics-${{ github.run_id }}
          path: results/scrape_do_diagnostics.json
          if-no-files-found: warn
          retention-days: 7
