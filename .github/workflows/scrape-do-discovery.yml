name: Scrape.do AutoZone Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "providers/**"
      - "config/**"
      - "runner/**"
      - "requirements.txt"
      - ".github/workflows/scrape-do-discovery.yml"

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show commit being tested
        run: git log -1 --format="%H %s"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run staged Scrape.do diagnostics
        env:
          SCRAPE_DO_API_KEY: ${{ secrets.SCRAPE_DO_API_KEY }}
        run: |
          test -n "$SCRAPE_DO_API_KEY" || (echo "SCRAPE_DO_API_KEY GitHub Actions secret is missing" && exit 1)
          mkdir -p results
          python - <<'PY'
          import json
          from pathlib import Path
          from providers.scrape_do import ScrapeDoProvider

          test_case = json.loads(Path("config/test_case.json").read_text())
          provider = ScrapeDoProvider()
          results = provider.diagnose({**test_case, "session_id": "azmvp01"})

          output = []
          for result in results:
              row = {
                  "provider": result.provider,
                  "request_success": result.request_success,
                  "latency_ms": result.latency_ms,
                  "provider_cost": result.provider_cost,
                  "error": result.error,
                  "raw_response": result.raw_response,
              }
              output.append(row)
              print(json.dumps({
                  "mode": result.raw_response.get("mode") if result.raw_response else result.provider,
                  "request_success": result.request_success,
                  "status_code": (result.raw_response or {}).get("status_code"),
                  "latency_ms": result.latency_ms,
                  "provider_cost": result.provider_cost,
                  "error": result.error,
              }, indent=2))

          Path("results/scrape_do_diagnostics.json").write_text(
              json.dumps(output, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )
          PY

      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-do-autozone-diagnostics-${{ github.run_id }}
          path: results/scrape_do_diagnostics.json
          if-no-files-found: warn
          retention-days: 7
